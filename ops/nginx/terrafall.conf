server {
    listen 80;
    server_name terrafall.iqapps.space;
    return 301 https://terrafall.iqapps.space$request_uri;
}

server {
    listen 443 ssl;
    server_name terrafall.iqapps.space;

    # Only the site/ folder is public; the rest of the checkout (.git, ops, docs) is not.
    root /srv/apps/terrafall/site;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/terrafall.iqapps.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terrafall.iqapps.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The page asks for the visitor's location; allow it for this origin only.
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # No build step and no fingerprinted names: always revalidate (cheap 304s via ETag).
    location ~* \.(?:html|js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /favicon.svg {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
